<div class="chrome">
  <div class="breadcrumb">
    <span class="dots"><span></span><span></span><span></span></span>
    @for (crumb of crumbs; track $index) {
      <span class="crumb">{{ crumb }}</span>
      @if (!$last) {
        <span class="sep">▸</span>
      }
    }
  </div>

  <app-progress-ticks
    [count]="count"
    [currentIndex]="currentIndex"
    [paused]="paused"
    [durationMs]="durationMs"
  ></app-progress-ticks>
</div>
